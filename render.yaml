# ==============================================================================
# render.yaml - Render Cloud Deployment Blueprint for UniFinder AI
# Deploys FastAPI web service + managed free PostgreSQL database
# ==============================================================================

services:
  - type: web
    name: unifinder-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: unifinder-postgres
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false # Set in Render Dashboard
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: MISTRAL_API_KEY
        sync: false # Optional: Set in Render Dashboard
      - key: COHERE_API_KEY
        sync: false # Optional: Set in Render Dashboard
      - key: LANGCHAIN_API_KEY
        sync: false # Optional: Set in Render Dashboard
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: "unifinder-ai"

databases:
  - name: unifinder-postgres
    plan: free
    region: oregon
